server {
  listen 80;
  listen [::]:80;
  server_name qettyqapp.anamai.kz;
  location ^~ /.well-known/acme-challenge/ {
    root /data/qettyq-acme;
    default_type text/plain;
  }
  location / { return 301 https://$host$request_uri; }
}
server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name qettyqapp.anamai.kz;
  ssl_certificate /data/qettyq-letsencrypt/live/qettyqapp.anamai.kz/fullchain.pem;
  ssl_certificate_key /data/qettyq-letsencrypt/live/qettyqapp.anamai.kz/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  client_max_body_size 16k;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Frame-Options SAMEORIGIN always;
  location / {
    proxy_pass http://qettyq-app:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 60s;
  }
}
